name: .NET Core CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository with the FULL commit history
    # 'fetch-depth: 0' is mandatory so that 'git rev-list' can count all commits
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Calculate dynamic version: yy.MM.000X
    - name: Generate Dynamic Version
      id: get_version
      shell: pwsh
      run: |
        # Bypass Git security warnings regarding directory ownership on Linux runners
        git config --global --add safe.directory $env:GITHUB_WORKSPACE
        
        # Retrieve the current UTC time to avoid time zone discrepancies on the servers
        $nowUtc = [DateTime]::UtcNow
        $year = $nowUtc.ToString("yy")
        $month = $nowUtc.ToString("MM")
        
        # Define the first day of the current month in ISO format (UTC)
        $startOfMonthIso = "$($nowUtc.ToString("yyyy-MM"))-01T00:00:00Z"
        
        # Determine the correct reference pointer without relying on remote origin paths
        $targetRef = "HEAD"
        if ("${{ github.event_name }}" -eq "pull_request") {
            # Use the first parent commit if dealing with GitHub's ephemeral merge commit
            $targetRef = "HEAD^1"
        }
        
        # Count the number of commits in the current month using the validated local reference
        $commitCount = 0
        try {
            $commitCount = (git rev-list --count --since="$startOfMonthIso" $targetRef)
        } catch {
            # Fallback to HEAD if parent resolution fails unexpectedly
            $commitCount = (git rev-list --count --since="$startOfMonthIso" HEAD)
        }
        
        # If the counter is 0 (e.g., first commit of the month), set it to at least 1
        if ($commitCount -eq 0) { $commitCount = 1 }
        
        # Format the commit counter to 4 digits with leading zeros (e.g., 0005)
        $formattedCommits = $commitCount.ToString().PadLeft(4, '0')
        
        # Assemble the final version string
        $computedVersion = "${year}.${month}.${formattedCommits}"
        
        Write-Host "Calculated Application Version: v.$computedVersion"
        
        # Enforce pure UTF-8 without BOM using .NET API to prevent GitHub Actions environment parsing errors
        [System.IO.File]::AppendAllLines($env:GITHUB_ENV, [string[]]("APP_VERSION=$computedVersion"))

    # 3. Install .NET 9 SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # 4. Restore NuGet packages
    - name: Restore Dependencies
      run: dotnet restore

    # 5. Build the project and inject the dynamic version into the DLL/assembly
    - name: Build Project
      run: dotnet build --configuration Release --no-restore /p:Version=${{ env:APP_VERSION }}

    # 6. Run all unit tests
    - name: Run Tests
      run: dotnet test --configuration Release --no-build --verbosity normal
