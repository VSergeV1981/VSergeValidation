
name: .NET Core CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Generate dynamic application version
      - name: Generate Dynamic Version
        id: get_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nowUtc = [DateTime]::UtcNow

          $year = $nowUtc.ToString("yy")
          $month = $nowUtc.ToString("MM")

          $startOfMonthIso = "$($nowUtc.ToString('yyyy-MM'))-01T00:00:00Z"

          $targetRef = "HEAD"

          if ("${{ github.event_name }}" -eq "pull_request") {
              $targetRef = "HEAD^1"
          }

          $gitOutput = & git rev-list --count --since="$startOfMonthIso" $targetRef 2>&1

          if ($LASTEXITCODE -ne 0) {
              $gitOutput = & git rev-list --count --since="$startOfMonthIso" HEAD 2>&1

              if ($LASTEXITCODE -ne 0) {
                  throw "Git commit counting failed: $gitOutput"
              }
          }

          $commitCountText = ($gitOutput | Select-Object -Last 1).ToString().Trim()

          $commitCount = 0

          if (-not [int]::TryParse($commitCountText, [ref]$commitCount)) {
              throw "Invalid Git commit count: $commitCountText"
          }

          if ($commitCount -lt 1) {
              $commitCount = 1
          }

          $formattedCommits = $commitCount.ToString().PadLeft(4, '0')

          $computedVersion = "$year.$month.$formattedCommits"

          Write-Host "Calculated Application Version: v.$computedVersion"

          "APP_VERSION=$computedVersion" >> $env:GITHUB_ENV

      # 3. Install .NET 9 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # 4. Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # 5. Build application
      - name: Build Project
        run: |
          dotnet build \
            --configuration Release \
            --no-restore \
            /p:Version=${{ env.APP_VERSION }}

      # 6. Run tests
      - name: Run Tests
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --verbosity normal

      # 7. Upload build artifacts
      - name: Upload Build Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: VSergeValidation-v${{ env.APP_VERSION }}
          path: |
            **/bin/Release/net9.0/*.dll
            **/bin/Release/net9.0/*.json
          retention-days: 30

      # 8. Prepare release package
      - name: Prepare Release Files
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir staging
          cp VSergeValidation/bin/Release/net9.0/VSergeValidation.dll staging/
          cd staging
          zip -r ../VSergeValidation-v${{ env.APP_VERSION }}.zip .

      # 9. Create GitHub Release
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: VSergeValidation-v${{ env.APP_VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
